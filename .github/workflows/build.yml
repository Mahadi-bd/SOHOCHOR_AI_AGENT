name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # Android SDK is preinstalled on GitHub runners (ANDROID_HOME); just accept licenses.
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sahachor-debug-apk, path: app/build/outputs/apk/debug/*.apk, if-no-files-found: ignore }
      # A GitHub Release per push lets an updater app (Obtainium) install new builds on the phone automatically.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sahachor build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
